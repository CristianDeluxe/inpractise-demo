title = "In Practise Demo working-tree scan"

[extend]
path = ".gitleaks.toml"

[allowlist]
description = "Ignored local credentials and working artifacts; never used for committed history"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''^work/''',
  '''^supabase/\.temp/''',
  '''(^|/)\.env(\.[A-Za-z0-9_.-]+)?$''',
  '''^dist/''',
  '''^coverage/''',
  '''^reports/''',
]
