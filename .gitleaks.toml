title = "Research evidence demo history scan"

[extend]
useDefault = true

[allowlist]
description = "Integrity hashes and one exact non-secret research phrase"
# before-hashes.json records SHA-256 digests of corpus generator sources; every
# entry recomputes to the file it names, so the generic-api-key matches there
# are checksums, not credentials.
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  '''^corpus/generated/[^/]+/before-hashes\.json$''',
]
# The frozen research plan's "token, stale/tampered/foreign cursor" is prose.
regexTarget = 'secret'
regexes = ['''^stale/tampered/foreign$''']
